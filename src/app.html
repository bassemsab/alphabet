<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Alphabet Français — Apprentissage & Prononciation</title>
  <meta name="description" content="Apprenez l'alphabet français et maîtrisez votre prononciation avec une évaluation vocale assistée par IA." />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alphabet.ether.paris" />
  <meta property="og:title" content="Alphabet Français — Apprentissage & Prononciation" />
  <meta property="og:description" content="Apprenez l'alphabet français et maîtrisez votre prononciation avec une évaluation vocale en direct." />
  <meta property="og:image" content="https://img.ether.paris/ami/assets/logo.png?width=1000" />
  <meta property="og:image:width" content="1000" />
  <meta property="og:image:height" content="1000" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://alphabet.ether.paris" />
  <meta name="twitter:title" content="Alphabet Français — Apprentissage & Prononciation" />
  <meta name="twitter:description" content="Apprenez l'alphabet français et maîtrisez votre prononciation avec une évaluation vocale en direct." />
  <meta name="twitter:image" content="https://img.ether.paris/ami/assets/logo.png?width=1000" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("alphabet-theme");
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    })();
  </script>
  %sveltekit.head%
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white" data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
